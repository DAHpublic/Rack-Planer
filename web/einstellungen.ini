; Rack-Planer – Webversion: Einstellungen
;
; Diese Datei gehört dir: Updates (automatisch oder über den Browser) überschreiben sie nie.
; Fehlt sie, legt der Rack-Planer sie mit den Standardwerten neu an.
; Werte: true/false (auch an/aus geht: on/off, yes/no). Zeilen mit ; sind Kommentare.
; Nach einer Änderung genügt es, die Seite im Browser neu zu laden.

[update]
; Neue Versionen nachts automatisch von GitHub laden und einspielen.
; Der Ordner „daten“ (Schränke, eigene Vorlagen) und diese Datei bleiben dabei unverändert.
auto_update = true

; Zeitfenster für die Prüfung (Uhrzeit des Servers, HH:MM). Geprüft wird höchstens einmal je Nacht.
auto_update_von = "00:30"
auto_update_bis = "03:30"

; Update von Hand über Hilfe → Programm aktualisieren (ZIP hochladen). Standard: aus.
web_update = false

; Woher die Updates kommen (GitHub-Repository „Besitzer/Name“, dort das neueste Release).
quelle = "DAHpublic/Rack-Planer"

[speichern]
; Schränke und eigene Vorlagen auf dem Server speichern (Ordner „daten“).
; false: Der Server speichert nichts. „Speichern“ lädt den Schrank dann als .rack.json-Datei
; herunter, „Öffnen“ liest eine solche Datei ein (wie in der Desktop-Version).
server_speichern = true
