name: Webversion (HTML/PHP)

# Testet die Webversion (Rechenkern gegen rackcore, Browsertest mit PHP) und baut
# Rack-Planer-Web_v<V>.zip für die Synology (Web Station) bzw. jeden PHP-Webserver.
# Auf main (und beim manuellen Start) kommt das ZIP in das Release „v<Version>“ (zusammen mit der EXE).
on:
  push:
    paths: ["web/**", "rackcore/**", "tests/**", ".github/workflows/web.yml", ".github/scripts/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"          # älteste unterstützte Version – läuft dann auch mit 8.x
          extensions: zip, json, curl
          tools: none
      - name: Tests (Kern, Web-Rechenkern gegen rackcore)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q --ignore=tests/test_gui_smoke.py --ignore=tests/test_view3d.py
      - name: PHP-Syntax
        run: php -l web/api.php
      - name: ZIP bauen
        run: python web/build_web.py
      - name: Browsertest (entpacktes ZIP mit PHP-Server)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/srv" "$RUNNER_TEMP/srv2" "$RUNNER_TEMP/shots"
          unzip -q dist/Rack-Planer-Web_v*.zip -d "$RUNNER_TEMP/srv"
          unzip -q dist/Rack-Planer-Web_v*.zip -d "$RUNNER_TEMP/srv2"
          # Update von Hand ist standardmäßig aus – für den Test einschalten
          sed -i 's/^web_update = false/web_update = true/' "$RUNNER_TEMP/srv/rack-planer/einstellungen.ini"
          sed -i 's/^server_speichern = true/server_speichern = false/' "$RUNNER_TEMP/srv2/rack-planer/einstellungen.ini"
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/srv/rack-planer" > "$RUNNER_TEMP/php.log" 2>&1 &
          php -S 127.0.0.1:8098 -t "$RUNNER_TEMP/srv2/rack-planer" > "$RUNNER_TEMP/php2.log" 2>&1 &
          sleep 1
          node tests/e2e/web_e2e.js http://127.0.0.1:8099/ "$(ls dist/Rack-Planer-Web_v*.zip)" "$RUNNER_TEMP/shots"
          node tests/e2e/web_e2e_dateimodus.js http://127.0.0.1:8098/ "$RUNNER_TEMP/shots"
          grep -q "web_update = true" "$RUNNER_TEMP/srv/rack-planer/einstellungen.ini"   # Update hat die Einstellungen nicht überschrieben
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Webversion-Test
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/php.log
            ${{ runner.temp }}/php2.log
      - uses: actions/upload-artifact@v4
        with:
          name: Rack-Planer-Web
          path: dist/Rack-Planer-Web_v*.zip
      - name: An das Release v<Version> hängen
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release.sh dist/Rack-Planer-Web_v*.zip
